name: Publiser til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# En påbegynt publisering får alltid fullføre; nyere kjøringer venter i kø
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer avhengigheter
        working-directory: frontend
        run: npm ci

      - name: Verifiser prosessmodellen
        working-directory: frontend
        run: npx tsx src/sim/validate.ts

      - name: Tester av spillmotoren
        working-directory: frontend
        run: npx tsx src/game/tests.ts

      - name: Balansetest av spillet
        working-directory: frontend
        run: npx tsx src/game/balance.ts

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Bygg
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
