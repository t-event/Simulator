<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a3d"/>
      <stop offset="1" stop-color="#0d131c"/>
    </linearGradient>
    <linearGradient id="melt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a1e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="300" cy="360" r="170" fill="url(#glow)"/>
  <!-- Øse som heller -->
  <g transform="rotate(-28 190 190)">
    <path d="M90 120 L290 120 L268 290 Q190 312 112 290 Z" fill="#5b6572" stroke="#8d97a3" stroke-width="10" stroke-linejoin="round"/>
    <rect x="80" y="108" width="220" height="24" rx="10" fill="#8d97a3"/>
    <path d="M110 140 L270 140 L262 170 L118 170 Z" fill="url(#melt)"/>
  </g>
  <!-- Stålstråle -->
  <path d="M292 214 C 300 270, 296 320, 300 392" stroke="url(#melt)" stroke-width="26" stroke-linecap="round" fill="none"/>
  <!-- Kokille med glødende stål -->
  <rect x="222" y="380" width="160" height="80" rx="8" fill="#3b4450" stroke="#6d7784" stroke-width="8"/>
  <rect x="236" y="392" width="132" height="24" rx="4" fill="url(#melt)"/>
  <!-- Gnister -->
  <g fill="#ffd27a">
    <circle cx="352" cy="360" r="7"/>
    <circle cx="378" cy="330" r="5"/>
    <circle cx="246" cy="350" r="6"/>
    <circle cx="228" cy="322" r="4"/>
    <circle cx="400" cy="372" r="4"/>
  </g>
</svg>
